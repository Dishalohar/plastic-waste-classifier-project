<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Prediction History</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Prediction History</h1>

        <a href="{{ url_for('index') }}">
            Back to Classifier
        </a>

        <br><br>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Detected Plastic Type</th>
                    <th>Confidence</th>
                    <th>Date &amp; Time</th>
                </tr>
            </thead>
            <tbody>
                {% for row in records %}
                <tr>
                    <td>
                        <img
                            src="{{ url_for('static',
                            filename='uploads/' + row[0]) }}"
                            alt="Plastic image"
                            width="100">
                    </td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}%</td>
                    <td>{{ row[3] }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4">No predictions yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
